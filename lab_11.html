<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Header and Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-sm p-4">
        
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            
            <!-- Logo -->
            <h1 class="text-2xl font-bold tracking-wide">MyStore</h1>

            <!-- Navigation -->
            <nav class="flex items-center gap-2">
                
                <a href="#" class="px-3 py-2 rounded text-indigo-100 hover:text-white hover:bg-indigo-500 transition-colors">Home</a>
                
                <a href="#" class="px-3 py-2 rounded text-indigo-100 hover:text-white hover:bg-indigo-500 transition-colors">About</a>
                
                <!-- Dropdown -->
                <div class="relative group">
                    
                    <button class="px-3 py-2 rounded text-indigo-100 hover:text-white hover:bg-indigo-500 transition-colors inline-flex items-center">
                        Products
                    </button>
                    
                    <!-- Dropdown Menu -->
                    <div class="hidden group-hover:block absolute top-full left-0 mt-1 w-32 bg-white text-gray-800 rounded shadow-lg border border-gray-100 overflow-hidden z-10">
                        <a href="#" class="block px-4 py-2 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">Laptop</a>
                        <a href="#" class="block px-4 py-2 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">Mobile</a>
                        <a href="#" class="block px-4 py-2 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">Shoes</a>
                    </div>

                </div>

                <a href="#" class="px-3 py-2 rounded text-indigo-100 hover:text-white hover:bg-indigo-500 transition-colors">Contact</a>
                
            </nav>
        </div>
    </header>

</body>
</html>
